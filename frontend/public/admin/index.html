<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Cozy Corner · Admin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cutive+Mono&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    /* ============ AUTH (LOGIN) — só a tela de login ============
       Decap renderiza a login no body antes da app montar. O resto da
       UI fica com o estilo nativo do Decap. Os selectors abaixo só
       pegam containers de auth (não vazam pra rest of admin). */

    /* Fundo accent-blue na tela de login */
    [class*="AuthenticationPage"], [class*="AuthPage"] {
      background: #D7F5FF !important;
    }

    /* Logo grande do topo */
    [class*="AuthenticationPage"] img,
    [class*="AuthPage"] img {
      max-width: 560px !important;
      width: 90% !important;
      height: auto !important;
      margin: 0 auto 40px !important;
      opacity: 1 !important;
    }

    /* Botão "Login" */
    [class*="AuthenticationPage"] button[type="button"],
    [class*="AuthPage"] button[type="button"] {
      background: #1A1A1A !important;
      color: #FAF6EE !important;
      border: none !important;
      border-radius: 4px !important;
      padding: 14px 32px !important;
      font-family: 'Cutive Mono', monospace !important;
      font-size: 14px !important;
      font-weight: 400 !important;
      letter-spacing: 0.02em !important;
      box-shadow: 0 2px 8px rgba(26, 26, 26, 0.08) !important;
      transition: background 200ms ease, transform 200ms ease !important;
    }
    [class*="AuthenticationPage"] button[type="button"]:hover,
    [class*="AuthPage"] button[type="button"]:hover {
      background: #C56B4A !important;
      transform: translateY(-1px);
    }

    /* Textos auxiliares (ex: "Use Local Backend") */
    [class*="AuthenticationPage"] p,
    [class*="AuthPage"] p {
      font-family: 'Cutive Mono', monospace !important;
      color: #6B5F4F !important;
      font-size: 13px !important;
    }
  </style>
</head>
<body>
  <!-- Decap CMS injeta a UI aqui -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
