<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Cozy Corner · Admin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cutive+Mono&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    /* ============ COZY CORNER — Decap login ============
       Customização mínima da tela de login do Decap.
       Estratégia: deixa o Decap fazer o layout dele, só pinta e tipografa. */

    /* Fundo navy em toda a página (cobre Decap antes da app montar) */
    html, body {
      background: #1A2840;
      margin: 0;
      padding: 0;
      width: 100%;
    }

    /* Garante que toda a hierarquia de root do Decap ocupe full width
       (sem isso o container de auth fica num bloco estreito offset). */
    body > div,
    body > main {
      width: 100%;
      min-height: 100vh;
    }

    /* Container da auth: centraliza tudo na viewport */
    [class*="Authentication"],
    [class*="AuthPage"] {
      background: #1A2840 !important;
      width: 100% !important;
      min-height: 100vh !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 24px !important;
      gap: 32px !important;
    }

    /* Logo: invert pra ficar claro no fundo escuro */
    [class*="Authentication"] img,
    [class*="AuthPage"] img {
      width: min(80vw, 640px);
      height: auto;
      filter: invert(1);
    }

    /* Botão Login — flex pra centralizar texto e ícone interno */
    [class*="Authentication"] button,
    [class*="AuthPage"] button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      background: #C56B4A;
      color: #FFFFFF;
      border: 1px solid #C56B4A;
      border-radius: 4px;
      padding: 14px 32px;
      min-width: 220px;
      font-family: 'Cutive Mono', ui-monospace, monospace;
      font-size: 15px;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    [class*="Authentication"] button:hover,
    [class*="AuthPage"] button:hover {
      opacity: 0.92;
    }

    /* Link "Go back to site" */
    [class*="Authentication"] a,
    [class*="AuthPage"] a {
      color: rgba(245, 240, 229, 0.55);
      font-family: 'Cutive Mono', ui-monospace, monospace;
      font-size: 13px;
      text-decoration: none;
    }
    [class*="Authentication"] a:hover,
    [class*="AuthPage"] a:hover {
      color: #D58860;
    }

    /* Texto auxiliar (qualquer p, span solto) */
    [class*="Authentication"] p,
    [class*="AuthPage"] p {
      color: rgba(245, 240, 229, 0.55);
      font-family: 'Cutive Mono', ui-monospace, monospace;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <!-- Decap CMS injeta a UI aqui -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
