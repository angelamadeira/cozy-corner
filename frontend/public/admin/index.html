<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Cozy Corner · Admin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cutive+Mono&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    /* ============ AUTH (LOGIN) — só a tela de login ============
       Decap renderiza a login no body antes da app montar. O resto da
       UI fica com o estilo nativo do Decap. Os selectors abaixo só
       pegam containers de auth (não vazam pra rest of admin). */

    /* Fundo accent-blue + força centralização vertical da auth */
    [class*="AuthenticationPage"], [class*="AuthPage"] {
      background: #D7F5FF !important;
      min-height: 100vh !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 24px !important;
    }

    /* Logo grande do topo */
    [class*="AuthenticationPage"] img,
    [class*="AuthPage"] img {
      max-width: 560px !important;
      width: 90% !important;
      height: auto !important;
      margin: 0 auto 40px !important;
      opacity: 1 !important;
    }

    /* Botão "Login" — primary do DS escalado pra tela cheia */
    [class*="AuthenticationPage"] button[type="button"],
    [class*="AuthPage"] button[type="button"] {
      display: inline-flex !important;
      align-items: center !important;
      gap: 8px !important;
      background: #C56B4A !important;            /* --terracota */
      color: #FFFFFF !important;
      border: 1px solid #C56B4A !important;
      border-radius: 4px !important;              /* --r-sm */
      padding: 18px 40px !important;
      min-width: 240px !important;
      justify-content: center !important;
      font-family: 'Cutive Mono', monospace !important;
      font-size: 16px !important;                 /* --fs-body */
      font-weight: 400 !important;
      letter-spacing: 0.04em !important;
      box-shadow: none !important;
      cursor: pointer !important;
      transition: opacity 150ms, transform 150ms, background 300ms !important;
    }
    [class*="AuthenticationPage"] button[type="button"]:hover,
    [class*="AuthPage"] button[type="button"]:hover {
      opacity: 0.92 !important;
      transform: translateY(-1px) !important;
    }

    /* Textos auxiliares (ex: "Use Local Backend") */
    [class*="AuthenticationPage"] p,
    [class*="AuthPage"] p {
      font-family: 'Cutive Mono', monospace !important;
      color: #6B5F4F !important;
      font-size: 13px !important;
    }
  </style>
</head>
<body>
  <!-- Decap CMS injeta a UI aqui -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
