<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Cozy Corner · Admin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cutive+Mono&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    /* ============ AUTH (LOGIN) — só a tela de login ============
       Decap renderiza a login no body antes da app montar. O resto da
       UI fica com o estilo nativo do Decap. Os selectors abaixo só
       pegam containers de auth (não vazam pra rest of admin). */

    /* Fundo navy escuro (--cover-dark) + centralização vertical */
    html, body { background: #1A2840 !important; }
    [class*="AuthenticationPage"], [class*="AuthPage"] {
      background: #1A2840 !important;
      min-height: 100vh !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 24px !important;
    }

    /* Logo grandão. invert(1) inverte preto → branco cremoso pra
       ficar legível no fundo escuro. */
    [class*="AuthenticationPage"] img,
    [class*="AuthPage"] img {
      max-width: 720px !important;
      width: 92% !important;
      height: auto !important;
      margin: 0 auto 56px !important;
      opacity: 1 !important;
      filter: invert(1) hue-rotate(180deg) !important;
    }

    /* Botão "Login" — primary do DS escalado pra tela cheia.
       Decap v3 usa class names auto-gerados; selectors amplos pegam
       qualquer <button> dentro do container de auth. */
    [class*="Authentication"] button,
    [class*="AuthPage"] button,
    [class*="auth"] button[type="button"] {
      display: inline-flex !important;
      align-items: center !important;
      gap: 8px !important;
      background: #C56B4A !important;
      color: #FFFFFF !important;
      border: 1px solid #C56B4A !important;
      border-radius: 4px !important;
      padding: 18px 40px !important;
      min-width: 240px !important;
      justify-content: center !important;
      font-family: 'Cutive Mono', monospace !important;
      font-size: 16px !important;
      font-weight: 400 !important;
      letter-spacing: 0.04em !important;
      box-shadow: none !important;
      cursor: pointer !important;
      transition: opacity 150ms, transform 150ms, background 300ms !important;
    }
    [class*="Authentication"] button:hover,
    [class*="AuthPage"] button:hover,
    [class*="auth"] button[type="button"]:hover {
      opacity: 0.92 !important;
      transform: translateY(-1px) !important;
    }

    /* "Go back to site" link */
    [class*="Authentication"] a,
    [class*="AuthPage"] a {
      color: rgba(245, 240, 229, 0.55) !important;
      font-family: 'Cutive Mono', monospace !important;
      font-size: 13px !important;
      text-decoration: none !important;
      margin-top: 24px !important;
    }
    [class*="Authentication"] a:hover,
    [class*="AuthPage"] a:hover {
      color: #D58860 !important;
    }
    /* Setinha do "go back" — força stroke claro no SVG */
    [class*="Authentication"] a svg,
    [class*="AuthPage"] a svg {
      filter: invert(1) opacity(0.55) !important;
    }

    /* Textos auxiliares (ex: "Use Local Backend") */
    [class*="AuthenticationPage"] p,
    [class*="AuthPage"] p {
      font-family: 'Cutive Mono', monospace !important;
      color: #6B5F4F !important;
      font-size: 13px !important;
    }
  </style>
</head>
<body>
  <!-- Decap CMS injeta a UI aqui -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
