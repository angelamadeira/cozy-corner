# Decap CMS config
# https://decapcms.org/docs/configuration-options/

backend:
  name: github
  repo: angelamadeira/cozy-corner
  branch: main
  # OAuth proxy: Pages Functions na mesma origem (frontend/functions/auth.js
  # e callback.js). Variáveis GITHUB_CLIENT_ID + GITHUB_CLIENT_SECRET ficam
  # no Cloudflare Pages → Settings → Variables and Secrets.
  base_url: https://cozy-corner.pages.dev
  auth_endpoint: auth
  # API proxy: roteia chamadas pro GitHub via Cloudflare Function (functions/api/).
  # Necessário porque alguns ISPs/firewalls bloqueiam api.github.com direto.
  api_root: https://cozy-corner.pages.dev/api

# Permite rodar Decap localmente com `npx decap-server`
local_backend: true

# Workflow editorial: rascunho → revisão → publicado
publish_mode: editorial_workflow

# Onde Decap salva uploads (imagens/vídeos)
media_folder: "frontend/public/uploads"
public_folder: "/uploads"

# Logo + título customizado do admin
logo_url: /logos/cozy-corner-logo.svg?v=5
site_url: https://cozycorner.recipes

collections:
  # ====================== RECEITAS ======================
  - name: recipes
    label: Receitas
    label_singular: Receita
    folder: frontend/src/content/recipes
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} · {{category}}"
    sortable_fields: [title, publishedAt, category, time]
    editor:
      preview: false  # desabilita painel de preview (que fica cinza vazio)
    view_filters:
      - { label: Publicadas, field: published, pattern: true }
      - { label: Rascunhos, field: published, pattern: false }
    fields:
      - { name: title, label: Título, widget: string }
      - { name: description, label: Descrição curta, widget: text, required: false }
      - name: category
        label: Categorias
        widget: select
        multiple: true
        min: 1
        hint: "Pode selecionar mais de uma. A PRIMEIRA da lista é a principal (usada no link 'voltar pra categoria' da receita)."
        options:
          - { label: "Pratos principais", value: principais }
          - { label: "Sobremesas", value: sobremesas }
          - { label: "Datas comemorativas", value: datas }
          - { label: "Vegetarianas", value: vegetarianas }
          - { label: "Para congelar", value: congelar }
          - { label: "Receitas rápidas", value: rapidas }
      - { name: time, label: "Tempo (minutos)", widget: number, default: 30, value_type: int }
      - { name: servings, label: Porções, widget: number, required: false, value_type: int, hint: "Opcional — deixe em branco se não se aplica" }
      - name: difficulty
        label: Dificuldade
        widget: select
        default: médio
        options: [fácil, médio, difícil]
      - name: unitSystem
        label: Sistema de unidades
        widget: select
        default: metric
        options:
          - { label: "Métrico (g, ml, °C)", value: metric }
          - { label: "Imperial (oz, cup, °F)", value: imperial }
      - name: tags
        label: Tags (filtros)
        widget: list
        required: false
      - name: media
        label: Mídia (fotos e vídeos)
        widget: list
        required: true
        hint: "Adicione pelo menos uma mídia — a PRIMEIRA da lista será a capa da receita. Pra trocar a capa, arraste a mídia desejada pro topo da lista."
        summary: "{{fields.url}}{{fields.src}}"
        fields:
          - name: type
            label: Tipo
            widget: select
            options: [image, video]
            default: image
          - { name: src, label: Arquivo (upload), widget: file, required: false, hint: "Upload local. Ou use o campo URL abaixo." }
          - { name: url, label: URL externa, widget: string, required: false, hint: "Ex: https://www.youtube.com/watch?v=... ou link direto pra uma imagem. Use apenas se NÃO fez upload acima." }
          - { name: alt, label: "Descrição (alt text)", widget: string, required: false }
      - name: ingredients
        label: Ingredientes
        widget: list
        hint: "Adicione um ingrediente por linha. Comece com a quantidade (ex: '200g arroz arbóreo')."
        field: { name: item, label: Ingrediente, widget: string }
      - name: materials
        label: "Materiais (utensílios)"
        widget: list
        required: false
        hint: "Ex: panela média de fundo grosso"
        field: { name: item, label: Material, widget: string }
      - name: steps
        label: Modo de preparo
        widget: list
        hint: "Um passo por item. Pode ser uma frase ou um parágrafo."
        field: { name: item, label: Passo, widget: text }
      - { name: notes, label: Observações, widget: text, required: false }
      - { name: published, label: Publicada, widget: boolean, default: true }
      - { name: publishedAt, label: Data de publicação, widget: datetime }
      - name: lang
        label: Idioma
        widget: select
        default: pt-br
        options: [pt-br] # adicionar 'en' quando habilitar EN
      - { name: body, label: "Markdown adicional (opcional)", widget: markdown, required: false }

  # ====================== PÁGINAS / TEXTOS ======================
  # Cada arquivo aqui tem campos em PT e EN. O i18n do site lê desses
  # JSONs e sobrescreve o pt.json/en.json default — então mudanças aqui
  # aparecem direto no site após o deploy.
  - name: pages
    label: "Páginas (textos do site)"
    files:
      # ---------- INTRO (boas-vindas com typewriter) ----------
      - name: intro
        label: 🟦 Intro (boas-vindas)
        file: frontend/src/content/pages/intro.json
        format: json
        fields:
          - name: pt
            label: 🇧🇷 Português
            widget: object
            fields:
              - { name: hello, label: "Frase 1 (typewriter)", widget: string, default: "olá!" }
              - { name: welcome, label: "Frase 2 (typewriter)", widget: string, default: "que bom te ver por aqui :)" }
              - { name: skip, label: "Texto do botão pular", widget: string, default: "pular intro" }
          - name: en
            label: 🇬🇧 English
            widget: object
            fields:
              - { name: hello, label: "Phrase 1 (typewriter)", widget: string, default: "hello!" }
              - { name: welcome, label: "Phrase 2 (typewriter)", widget: string, default: "happy to see you here :)" }
              - { name: skip, label: "Skip button text", widget: string, default: "skip intro" }

      # ---------- COZINHA — tooltips dos hotspots + balão do Akim ----------
      - name: cozinha
        label: 🍳 Cozinha — tooltips dos hotspots
        file: frontend/src/content/pages/cozinha.json
        format: json
        fields:
          - name: pt
            label: 🇧🇷 Português
            widget: object
            fields:
              - { name: recado, label: "Post-it (deixar recado)", widget: string, default: "Deixar um recadinho" }
              - { name: sobre, label: "Foto na parede (sobre nós)", widget: string, default: "Nossa cozinha" }
              - { name: vegetarianas, label: "Vaso (vegetarianas)", widget: string, default: "vegetarianas" }
              - { name: akim_meow, label: "Akim — balão de fala (clique no gato)", widget: string, default: "miau 🐱" }
              - { name: dark_mode_on, label: "Interruptor — luz apagada → acender", widget: string, default: "Que tal acender a luz?" }
              - { name: dark_mode_off, label: "Interruptor — luz acesa → apagar", widget: string, default: "Que tal apagar a luz?" }
          - name: en
            label: 🇬🇧 English
            widget: object
            fields:
              - { name: recado, label: "Post-it (leave a note)", widget: string, default: "Leave a little note" }
              - { name: sobre, label: "Wall photo (about us)", widget: string, default: "Our kitchen" }
              - { name: vegetarianas, label: "Plant (vegetarian)", widget: string, default: "vegetarian" }
              - { name: akim_meow, label: "Akim — speech bubble (click the cat)", widget: string, default: "meow 🐱" }
              - { name: dark_mode_on, label: "Switch — light off → turn on", widget: string, default: "Care to turn on the light?" }
              - { name: dark_mode_off, label: "Switch — light on → turn off", widget: string, default: "Care to turn off the light?" }

      # ---------- RECADO (modal do post-it) ----------
      # Os recados ficam salvos no Cloudflare KV (lidos em /admin-recados/).
      # Não há envio de email automático — não precisa de email/subject/template.
      - name: recado
        label: 💌 Recado (post-it)
        file: frontend/src/content/pages/recado.json
        format: json
        fields:
          - name: pt
            label: 🇧🇷 Português
            widget: object
            fields:
              - { name: title, label: "Título do modal", widget: string, default: "Deixa um recado" }
              - { name: subtitle, label: "Subtítulo", widget: string, default: "ou só um oi mesmo" }
              - { name: name_label, label: "Label do campo nome", widget: string, default: "seu nome" }
              - { name: email_label, label: "Label do campo email", widget: string, default: "seu email" }
              - { name: message_label, label: "Label do campo mensagem", widget: string, default: "mensagem" }
              - { name: placeholder, label: "Placeholder da mensagem", widget: string, default: "oi Gigi!" }
              - { name: send, label: "Botão enviar", widget: string, default: "enviar" }
              - { name: sending, label: "Texto enquanto envia", widget: string, default: "enviando..." }
              - { name: sent, label: "Mensagem de sucesso", widget: string, default: "obrigada pelo recado! 💛" }
              - { name: empty, label: "Erro — mensagem vazia", widget: string, default: "escreve a mensagem antes de enviar :)" }
              - { name: email_invalid, label: "Erro — email inválido", widget: string, default: "coloca um email válido pra eu poder responder :)" }
              - { name: error, label: "Erro genérico", widget: string, default: "ops, algo deu errado" }
          - name: en
            label: 🇬🇧 English
            widget: object
            fields:
              - { name: title, label: "Modal title", widget: string, default: "Leave a note" }
              - { name: subtitle, label: "Subtitle", widget: string, default: "or just say hi" }
              - { name: name_label, label: "Name field label", widget: string, default: "your name" }
              - { name: email_label, label: "Email field label", widget: string, default: "your email" }
              - { name: message_label, label: "Message field label", widget: string, default: "message" }
              - { name: placeholder, label: "Message placeholder", widget: string, default: "hi Gigi!" }
              - { name: send, label: "Send button", widget: string, default: "send" }
              - { name: sending, label: "Text while sending", widget: string, default: "sending..." }
              - { name: sent, label: "Success message", widget: string, default: "thanks for the note! 💛" }
              - { name: empty, label: "Error — empty message", widget: string, default: "type a message before sending :)" }
              - { name: email_invalid, label: "Error — invalid email", widget: string, default: "drop a valid email so I can reply :)" }
              - { name: error, label: "Generic error", widget: string, default: "oops, something went wrong" }

      # ---------- SOBRE / NOSSA COZINHA (drawer com foto + texto) ----------
      - name: sobre
        label: 🏡 Nossa cozinha (sobre)
        file: frontend/src/content/pages/sobre.json
        format: json
        fields:
          - name: pt
            label: 🇧🇷 Português
            widget: object
            fields:
              - { name: title, label: "Título do drawer", widget: string, default: "Oi, tudo bem?" }
              - { name: photo_alt, label: "Descrição da foto (acessibilidade)", widget: string, default: "Foto da Gigi com o marido" }
              - { name: p1, label: "Parágrafo 1", widget: text }
              - { name: p2, label: "Parágrafo 2", widget: text }
              - { name: p3, label: "Parágrafo 3", widget: text }
              - { name: p4, label: "Parágrafo 4", widget: text }
          - name: en
            label: 🇬🇧 English
            widget: object
            fields:
              - { name: title, label: "Drawer title", widget: string, default: "Hi, how are you?" }
              - { name: photo_alt, label: "Photo description (accessibility)", widget: string, default: "Photo of Gigi and her husband" }
              - { name: p1, label: "Paragraph 1", widget: text }
              - { name: p2, label: "Paragraph 2", widget: text }
              - { name: p3, label: "Paragraph 3", widget: text }
              - { name: p4, label: "Paragraph 4", widget: text }

      # ---------- CONFIGURAÇÃO GERAL ----------
      - name: site
        label: ⚙️ Configuração geral
        file: frontend/src/content/pages/site.json
        format: json
        fields:
          - { name: title, label: Título do site, widget: string, default: "Cozy Corner · recipes by Gigi" }
          - { name: tagline, label: Tagline, widget: string, default: "recipes by Gigi" }
          - { name: instagram, label: Instagram (handle, sem @), widget: string, required: false }
          - { name: email, label: Email principal, widget: string, default: "angelmadeira@gmail.com" }
